title: "FlashStieltjes: Fast and Memory-Efficient Flash-Style Attention with Algebraic Normalization"
authors: ["Alex Gulko"]
note: "Advised by Sachin Kumar"
venue: "Undergraduate Honors Research Thesis, The Ohio State University, 2026"
date: "2026-04-01"
description: "Stieltjes attention replaces softmax's exponential with algebraic weights that have polynomial tails. FlashStieltjes is an open-source flash-style Triton kernel for it: a 3.37× faster forward pass on an A100 (3.78× on an H100) and 4.9× less peak memory than a PyTorch reference."
